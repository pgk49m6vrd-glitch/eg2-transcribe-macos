name: Build macOS App & DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build EG2Transcribe.app & French Sténo Core ML (macOS 27 / Xcode 27 arm64)
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify macOS 27 & Xcode 27 toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Install XcodeGen if needed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build EG2Transcribe.app (Release, arm64)
        run: |
          xcodebuild \
            -project EG2Transcribe.xcodeproj \
            -scheme EG2TranscribeMac \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app into .dmg and .zip
        run: |
          chmod +x scripts/package_dmg.sh
          ./scripts/package_dmg.sh "build/Build/Products/Release/EG2Transcribe.app" dist

      - name: Set up Python 3.12 for French 4-Gram LM & Sténo Core ML
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Prepare StenoFr.mlpackage & Build French 4-Gram LM (lm_fr.bin)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then
            TAG="v1.2.0"
          fi
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -q "^StenoFr.mlpackage.zip$"; then
            echo "Downloading StenoFr.mlpackage.zip and steno_fr_meta.json from $TAG..."
            gh release download "$TAG" -p "StenoFr.mlpackage.zip" -p "steno_fr_meta.json" -D dist --clobber
          elif gh release view "v1.1.0" --json assets --jq '.assets[].name' 2>/dev/null | grep -q "^StenoFr.mlpackage.zip$"; then
            echo "Reusing verified StenoFr.mlpackage.zip and steno_fr_meta.json from v1.1.0..."
            gh release download "v1.1.0" -p "StenoFr.mlpackage.zip" -p "steno_fr_meta.json" -D dist --clobber
          else
            pip install --upgrade pip
            pip install "torch>=2.14" "transformers>=5.19" "coremltools>=9.0" "huggingface_hub>=1.0" "safetensors>=0.8" "numpy>=1.26"
            python scripts/export_steno_fr_coreml.py --model large --out dist/steno_fr
            cp dist/steno_fr/steno_fr_meta.json dist/steno_fr_meta.json
            /usr/bin/ditto -c -k --keepParent dist/steno_fr/StenoFr.mlpackage dist/StenoFr.mlpackage.zip
            rm -rf dist/steno_fr
          fi

          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -q "^lm_fr.bin$"; then
            echo "Downloading existing lm_fr.bin from $TAG..."
            gh release download "$TAG" -p "lm_fr.bin" -D dist --clobber
          else
            pip install --upgrade pip
            pip install "numpy>=1.26" "pyarrow>=15.0" "huggingface_hub>=1.0"
            python scripts/build_fr_lm.py --out dist/lm_fr.bin
          fi

          (cd dist && shasum -a 256 EG2Transcribe-macOS-arm64.dmg EG2Transcribe-macOS-arm64.zip StenoFr.mlpackage.zip steno_fr_meta.json lm_fr.bin > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload DMG & ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EG2Transcribe-macOS-arm64
          path: |
            dist/EG2Transcribe-macOS-arm64.dmg
            dist/EG2Transcribe-macOS-arm64.zip
            dist/steno_fr_meta.json
            dist/lm_fr.bin
            dist/SHA256SUMS.txt

      - name: Publish / Update GitHub Release (on main push)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then
            TAG="v1.2.0"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/EG2Transcribe-macOS-arm64.dmg \
              dist/EG2Transcribe-macOS-arm64.zip \
              dist/StenoFr.mlpackage.zip \
              dist/steno_fr_meta.json \
              dist/lm_fr.bin \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              dist/EG2Transcribe-macOS-arm64.dmg \
              dist/EG2Transcribe-macOS-arm64.zip \
              dist/StenoFr.mlpackage.zip \
              dist/steno_fr_meta.json \
              dist/lm_fr.bin \
              dist/SHA256SUMS.txt \
              --latest \
              --title "EG2 Transcribe $TAG — Français Sténo (4-Gram Beam Search + ITN) + Anglais Core AI + Multilingue" \
              --notes "Application macOS prête à l'emploi (\`.dmg\` et \`.zip\`) basée sur **Google EmbeddingGemma 2** + **CTC Reader** :\n- 🇫🇷 **Français — Sténo v1 Large + 4-Gram Beam Search (\`lm_fr.bin\`) + ITN Déterministe** :\n  - **Décodeur CTC Prefix Beam Search + Modèle de langue 4-Gramme Français (\`lm_fr.bin\`, ~48 Mo mappé en mémoire via \`mmap\`, 0 Mo RAM)** : exploite les Top-8 candidats par trame de 40 ms de \`StenoFr.mlpackage\` avec lissage Kneser-Ney interpolé pour désambiguïser les homophones grammaticaux (\`a/à\`, \`c'est/s'est\`, \`ou/où\`, \`on/ont\`, \`-é/-er/-ez\`) en < 2 ms sans altérer le franglais ni les termes techniques.\n  - **ITN Français Déterministe en Swift pur (\`FrenchITN\`)** : convertit instantanément (< 0,1 ms, 0 Mo RAM, 0 % hallucination) les nombres parlés en chiffres (\`« ticket quatre cent douze »\` → \`« ticket 412 »\`, \`« version un point deux »\` → \`« version 1.2 »\`, \`« quatre-vingt-dix pour cent »\` → \`« 90 % »\`) tout en protégeant l'article indéfini \`un/une\`.\n- 🇬🇧 **Anglais Ultra-Rapide — Core AI Reader v2 (\`mlboydaisuke/EmbeddingGemma-2-Transcribe-CoreAI\`)** : 200 000 mots anglais dans l'espace 768-d.\n- 🌐 **Multilingue zh / en / ja / ko v4 (\`TimHu950112/eg2-transcribe-zh-en-ja-ko\`)** : Core ML + N-Gram LM.\n\n### Installation (sans compte développeur Apple payant)\n1. Ouvrez \`EG2Transcribe-macOS-arm64.dmg\` et glissez \`EG2Transcribe.app\` dans \`/Applications\`.\n2. Faites **Clic droit > Ouvrir** sur \`EG2Transcribe.app\` (ou exécutez \`xattr -cr /Applications/EG2Transcribe.app\`)."
          fi
