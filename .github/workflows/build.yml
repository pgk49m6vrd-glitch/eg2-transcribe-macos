name: Build macOS App & DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build EG2Transcribe.app & French Sténo Core ML (macOS 27 / Xcode 27 arm64)
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify macOS 27 & Xcode 27 toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Install XcodeGen if needed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build EG2Transcribe.app (Release, arm64)
        run: |
          xcodebuild \
            -project EG2Transcribe.xcodeproj \
            -scheme EG2TranscribeMac \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app into .dmg and .zip
        run: |
          chmod +x scripts/package_dmg.sh
          ./scripts/package_dmg.sh "build/Build/Products/Release/EG2Transcribe.app" dist

      - name: Set up Python 3.12 for Sténo French Core ML export
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Export & Verify French Sténo v1 Large (EmbeddingGemma 2 CTC -> StenoFr.mlpackage)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then
            TAG="v1.1.0"
          fi
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -q "^StenoFr.mlpackage.zip$"; then
            echo "StenoFr.mlpackage.zip already published on $TAG; downloading existing assets..."
            gh release download "$TAG" -p "StenoFr.mlpackage.zip" -p "steno_fr_meta.json" -D dist --clobber
          else
            pip install --upgrade pip
            pip install "torch>=2.14" "transformers>=5.19" "coremltools>=9.0" "huggingface_hub>=1.0" "safetensors>=0.8" "numpy>=1.26"
            python scripts/export_steno_fr_coreml.py --model large --out dist/steno_fr
            cp dist/steno_fr/steno_fr_meta.json dist/steno_fr_meta.json
            /usr/bin/ditto -c -k --keepParent dist/steno_fr/StenoFr.mlpackage dist/StenoFr.mlpackage.zip
            rm -rf dist/steno_fr
          fi
          (cd dist && shasum -a 256 EG2Transcribe-macOS-arm64.dmg EG2Transcribe-macOS-arm64.zip StenoFr.mlpackage.zip steno_fr_meta.json > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload DMG & ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EG2Transcribe-macOS-arm64
          path: |
            dist/EG2Transcribe-macOS-arm64.dmg
            dist/EG2Transcribe-macOS-arm64.zip
            dist/steno_fr_meta.json
            dist/SHA256SUMS.txt

      - name: Publish / Update GitHub Release (on main push)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then
            TAG="v1.1.0"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/EG2Transcribe-macOS-arm64.dmg \
              dist/EG2Transcribe-macOS-arm64.zip \
              dist/StenoFr.mlpackage.zip \
              dist/steno_fr_meta.json \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              dist/EG2Transcribe-macOS-arm64.dmg \
              dist/EG2Transcribe-macOS-arm64.zip \
              dist/StenoFr.mlpackage.zip \
              dist/steno_fr_meta.json \
              dist/SHA256SUMS.txt \
              --latest \
              --title "EG2 Transcribe $TAG — Français Sténo + Anglais Core AI + Multilingue (macOS Apple Silicon)" \
              --notes "Application macOS prête à l'emploi (\`.dmg\` et \`.zip\`) basée sur **Google EmbeddingGemma 2** + **CTC Reader** :\n- 🇫🇷 **Français — Sténo v1 Large (\`guigssss/steno-fr-v1-large\`)** : lecteur CTC 10 blocs sur les 13 états de l'encodeur audio EmbeddingGemma 2 (30 002 pièces de mots Gemma avec majuscules et ponctuation, WER 8,8 % MLS FR / 9,7 % FLEURS FR).\n- 🇬🇧 **Anglais Ultra-Rapide — Core AI Reader v2 (\`mlboydaisuke/EmbeddingGemma-2-Transcribe-CoreAI\`)** : 200 000 mots anglais dans l'espace 768-d.\n- 🌐 **Multilingue zh / en / ja / ko v4 (\`TimHu950112/eg2-transcribe-zh-en-ja-ko\`)** : Core ML + N-Gram LM.\n\n### Installation (sans compte développeur Apple payant)\n1. Ouvrez \`EG2Transcribe-macOS-arm64.dmg\` et glissez \`EG2Transcribe.app\` dans \`/Applications\`.\n2. Faites **Clic droit > Ouvrir** sur \`EG2Transcribe.app\` (ou exécutez \`xattr -cr /Applications/EG2Transcribe.app\`)."
          fi
