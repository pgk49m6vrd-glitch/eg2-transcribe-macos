name: EG2Transcribe
options:
  bundleIdPrefix: com.eg2transcribe
  createIntermediateGroups: true

packages:
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.4

schemes:
  EG2TranscribeMac:
    build:
      targets:
        EG2TranscribeMac: all
    run:
      config: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: "EG2 Transcribe"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "EG2 Transcribe utilise le microphone pour transcrire votre voix localement sur ce Mac avec EmbeddingGemma 2."
    INFOPLIST_KEY_NSAppleEventsUsageDescription: "EG2 Transcribe colle automatiquement le texte transcrit dans l'application active."

targets:
  EG2TranscribeMac:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources
    dependencies:
      - package: swift-transformers
        product: Hub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eg2transcribe.mac
        PRODUCT_NAME: EG2Transcribe
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: "NO"
        ENABLE_APP_SANDBOX: "NO"
        ARCHS: arm64
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
